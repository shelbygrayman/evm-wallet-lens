<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVM Wallet Lens</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --text:#e8eaf0; --muted:#8a91a3; --accent:#6ea8ff; --err:#ff7a7a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:720px; margin:0 auto; padding:24px 16px; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px; }
  input, select, button { width:100%; padding:10px; border-radius:8px; border:1px solid #2a2f3a; background:#0f1115; color:var(--text); font-size:1rem; }
  button { background:var(--accent); color:#0f1115; font-weight:600; border:none; cursor:pointer; margin-top:14px; }
  table { width:100%; border-collapse:collapse; }
  td { padding:8px 4px; border-bottom:1px solid #2a2f3a; word-break:break-all; }
  td:first-child { color:var(--muted); width:40%; }
  .err { color:var(--err); }
</style>
</head>
<body>
<main>
  <h1>EVM Wallet Lens</h1>
  <p class="sub">Look up any wallet's native balance, transaction count and ERC-20 token balance on EVM chains, straight from the chain's RPC.</p>

  <div class="card">
    <label for="chain">Network</label>
    <select id="chain"></select>
    <label for="rpc">RPC URL (editable)</label>
    <input id="rpc">
    <label for="addr">Wallet address</label>
    <input id="addr" placeholder="0x...">
    <label for="token">ERC-20 token contracts (optional, separate with commas)</label>
    <input id="token" placeholder="0x..., 0x...">
    <button id="go">Look up</button>
  </div>

  <div class="card" id="out" hidden></div>
</main>

<script>
// Public RPC endpoints. Users can replace the URL for any EVM chain.
const CHAINS = [
  { name: "Ethereum", rpc: "https://eth.drpc.org", symbol: "ETH" },
  { name: "Base",     rpc: "https://mainnet.base.org",            symbol: "ETH" },
  { name: "Arbitrum", rpc: "https://arb1.arbitrum.io/rpc",        symbol: "ETH" },
  { name: "Custom",   rpc: "",                                     symbol: "native" }
];

const $ = id => document.getElementById(id);
CHAINS.forEach((c, i) => $("chain").add(new Option(c.name, i)));
$("rpc").value = CHAINS[0].rpc;
$("chain").onchange = () => { $("rpc").value = CHAINS[$("chain").value].rpc; };

const isAddress = a => /^0x[0-9a-fA-F]{40}$/.test(a);

// Minimal JSON-RPC call, no libraries needed.
async function rpc(url, method, params) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params })
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error.message);
  return json.result;
}

// Format a hex wei value as a decimal string with `decimals` places.
function formatUnits(hex, decimals) {
  const v = BigInt(hex);
  const base = 10n ** BigInt(decimals);
  const whole = v / base;
  const frac = (v % base).toString().padStart(decimals, "0").slice(0, 6).replace(/0+$/, "");
  return frac ? `${whole}.${frac}` : `${whole}`;
}

// Decode an ABI-encoded string return value (used for symbol()).
function decodeString(hex) {
  const data = hex.slice(2);
  if (data.length < 128) return "?";
  const len = parseInt(data.slice(64, 128), 16);
  const bytes = data.slice(128, 128 + len * 2).match(/.{2}/g) || [];
  return new TextDecoder().decode(new Uint8Array(bytes.map(b => parseInt(b, 16))));
}

const pad = addr => addr.toLowerCase().replace("0x", "").padStart(64, "0");
const ethCall = (url, to, data) => rpc(url, "eth_call", [{ to, data }, "latest"]);

$("go").onclick = async () => {
  const url = $("rpc").value.trim(), addr = $("addr").value.trim(), tokens = $("token").value.split(",").map(t => t.trim()).filter(Boolean);
  const out = $("out");
  out.hidden = false;
  if (!url) { out.innerHTML = '<p class="err">Enter an RPC URL.</p>'; return; }
  if (!isAddress(addr)) { out.innerHTML = '<p class="err">That is not a valid wallet address.</p>'; return; }
  const bad = tokens.find(t => !isAddress(t));
  if (bad) { out.innerHTML = `<p class="err">Not a valid token address: ${bad}</p>`; return; }
  out.textContent = "Loading...";
  try {
    const [chainId, balance, nonce] = await Promise.all([
      rpc(url, "eth_chainId", []),
      rpc(url, "eth_getBalance", [addr, "latest"]),
      rpc(url, "eth_getTransactionCount", [addr, "latest"])
    ]);
    const rows = [
      ["Chain ID", parseInt(chainId, 16)],
      ["Native balance", `${formatUnits(balance, 18)} ${CHAINS[$("chain").value].symbol}`],
      ["Transactions sent", parseInt(nonce, 16)]
    ];
    // Look up every token in parallel; one bad token doesn't break the others.
    const results = await Promise.all(tokens.map(async token => {
      try {
        // Function selectors: balanceOf(address)=0x70a08231, decimals()=0x313ce567, symbol()=0x95d89b41
        const [bal, dec, sym] = await Promise.all([
          ethCall(url, token, "0x70a08231" + pad(addr)),
          ethCall(url, token, "0x313ce567"),
          ethCall(url, token, "0x95d89b41")
        ]);
        return [decodeString(sym), formatUnits(bal, parseInt(dec, 16))];
      } catch (e) {
        return [token.slice(0, 10) + "...", "Error: " + e.message];
      }
    }));
    results.forEach(([sym, amount]) => rows.push([`Token: ${sym}`, amount]));
    out.innerHTML = "<table>" + rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("") + "</table>";
  } catch (e) {
    out.innerHTML = `<p class="err">Error: ${e.message}</p>`;
  }
};
</script>
</body>
</html>
