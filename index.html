<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVM Wallet Lens</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --text:#e8eaf0; --muted:#8a91a3; --accent:#6ea8ff; --err:#ff7a7a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:720px; margin:0 auto; padding:24px 16px; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px; }
  input, select, button { width:100%; padding:10px; border-radius:8px; border:1px solid #2a2f3a; background:#0f1115; color:var(--text); font-size:1rem; }
  button { background:var(--accent); color:#0f1115; font-weight:600; border:none; cursor:pointer; margin-top:14px; }
  table { width:100%; border-collapse:collapse; }
  td { padding:8px 4px; border-bottom:1px solid #2a2f3a; word-break:break-all; }
  td:first-child { color:var(--muted); width:40%; }
  .err { color:var(--err); }
</style>
</head>
<body>
<main>
  <h1>EVM Wallet Lens</h1>
  <p class="sub">Look up any wallet's native balance, transaction count and ERC-20 token balance on EVM chains, straight from the chain's RPC.</p>

  <div class="card">
    <label for="chain">Network</label>
    <select id="chain"></select>
    <label for="rpc">RPC URL (editable)</label>
    <input id="rpc">
    <label for="addr">Wallet address</label>
    <input id="addr" placeholder="0x...">
    <label for="token">ERC-20 token contracts (optional, separate with commas)</label>
    <input id="token" placeholder="0x..., 0x...">
    <button id="go">Look up</button>
  </div>

  <div class="card" id="out" hidden></div>
</main>

<script>
// Public RPC endpoints. Each lookup uses one verified endpoint and a captured network selection.
const CHAINS = [
  { name: 'Ethereum', rpc: 'https://eth.drpc.org', backup: 'https://1rpc.io/eth', id: 1n, symbol: 'ETH' },
  { name: 'Base', rpc: 'https://mainnet.base.org', backup: 'https://base-rpc.publicnode.com', id: 8453n, symbol: 'ETH' },
  { name: 'Arbitrum', rpc: 'https://arb1.arbitrum.io/rpc', id: 42161n, symbol: 'ETH' },
  { name: 'Custom', rpc: '', symbol: 'native' }
];
const $ = id => document.getElementById(id);
CHAINS.forEach((c, i) => $('chain').add(new Option(c.name, i)));
$('rpc').value = CHAINS[0].rpc;
$('chain').onchange = () => { $('rpc').value = CHAINS[$('chain').value].rpc; };
const isAddress = a => /^0x[0-9a-fA-F]{40}$/.test(a);
const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
function quantity(hex) {
  if (typeof hex !== 'string' || !/^0x(?:0|[1-9a-f][0-9a-f]*)$/i.test(hex) || hex.length > 66) throw new Error('Invalid RPC quantity.');
  return BigInt(hex);
}
function uintWord(hex) {
  if (typeof hex !== 'string' || !/^0x[0-9a-f]{64}$/i.test(hex)) throw new Error('Expected one ABI uint256 word.');
  return BigInt(hex);
}
function validateURL(value) {
  const url = new URL(value);
  if (url.username || url.password || url.hash || !['https:', 'http:'].includes(url.protocol)) throw new Error('Use an HTTP(S) RPC URL without embedded credentials or fragments.');
  if (url.protocol === 'http:' && !['localhost', '127.0.0.1', '[::1]'].includes(url.hostname)) throw new Error('Remote RPC URLs must use HTTPS.');
  return url.href;
}
let requestId = 0;
async function rpcOnce(url, method, params) {
  const id = ++requestId;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id, method, params }), signal: controller.signal, redirect: 'error' });
    if (!res.ok) throw new Error(`RPC HTTP ${res.status}`);
    const reader = res.body?.getReader();
    if (!reader) throw new Error('Empty RPC response.');
    const parts = []; let length = 0;
    try {
      while (true) {
        const { value, done } = await reader.read(); if (done) break;
        length += value.byteLength;
        if (length > 1048576) { await reader.cancel(); throw new Error('RPC response exceeds 1 MB.'); }
        parts.push(value);
      }
    } finally { reader.releaseLock(); }
    const bytes = new Uint8Array(length); let offset = 0;
    for (const part of parts) { bytes.set(part, offset); offset += part.length; }
    const json = JSON.parse(new TextDecoder().decode(bytes));
    if (!json || json.jsonrpc !== '2.0' || json.id !== id || Object.hasOwn(json, 'result') === Object.hasOwn(json, 'error')) throw new Error('Invalid JSON-RPC response.');
    if (Object.hasOwn(json, 'error')) throw new Error(typeof json.error?.message === 'string' ? json.error.message.slice(0, 300) : 'RPC returned an error.');
    return json.result;
  } catch (error) { if (controller.signal.aborted) throw new Error('RPC timed out after 10 seconds.'); throw error; }
  finally { clearTimeout(timer); }
}
function formatUnits(value, decimals) {
  if (!Number.isInteger(decimals) || decimals < 0 || decimals > 255) throw new Error('Token decimals must be 0–255.');
  const v = BigInt(value); if (v < 0n || v >= 2n ** 256n) throw new Error('Amount is outside uint256.');
  if (!decimals) return v.toString();
  const digits = v.toString().padStart(decimals + 1, '0');
  const whole = digits.slice(0, -decimals), fraction = digits.slice(-decimals);
  const shown = fraction.slice(0, 6).replace(/0+$/, '');
  if (v > 0n && whole === '0' && !shown) return '<0.000001';
  return whole + (shown ? '.' + shown : '');
}
function decodeString(hex) {
  if (typeof hex !== 'string' || !/^0x(?:[0-9a-f]{2})*$/i.test(hex)) throw new Error('Invalid token symbol encoding.');
  const data = hex.slice(2); let payload;
  if (data.length === 64) payload = data.replace(/(?:00)+$/, '');
  else {
    if (data.length < 128 || BigInt('0x' + data.slice(0, 64)) !== 32n) throw new Error('Invalid token symbol offset.');
    const len = BigInt('0x' + data.slice(64, 128));
    if (len > 256n || data.length !== 128 + Number((len + 31n) / 32n) * 64) throw new Error('Invalid token symbol length.');
    const end = 128 + Number(len) * 2;
    if (!/^0*$/.test(data.slice(end))) throw new Error('Invalid token symbol padding.');
    payload = data.slice(128, end);
  }
  return new TextDecoder('utf-8', { fatal: true }).decode(Uint8Array.from(payload.match(/../g) || [], b => parseInt(b, 16))) || '?';
}
const pad = addr => addr.toLowerCase().slice(2).padStart(64, '0');
async function nativeSnapshot(url, expectedChain) {
  const id = quantity(await rpcOnce(url, 'eth_chainId', []));
  if (expectedChain !== undefined && id !== expectedChain) throw new Error('RPC chain does not match the selected network. Select Custom for a different chain.');
  return id;
}
let loading = false;
$('go').onclick = async () => {
  if (loading) return;
  const chain = { ...CHAINS[$('chain').value] };
  const rawURL = $('rpc').value.trim(), addr = $('addr').value.trim();
  const tokens = [...new Set($('token').value.split(',').map(t => t.trim()).filter(Boolean))];
  const out = $('out'); out.hidden = false;
  const fail = message => { out.innerHTML = `<p class="err">${escapeHTML(message)}</p>`; };
  if (!rawURL) { fail('Enter an RPC URL.'); return; }
  if (!isAddress(addr)) { fail('That is not a valid wallet address.'); return; }
  const bad = tokens.find(t => !isAddress(t)); if (bad) { fail('Not a valid token address: ' + bad); return; }
  if (tokens.length > 20) { fail('Limit: 20 token contracts per lookup.'); return; }
  let url; try { url = validateURL(rawURL); } catch (e) { fail(e.message); return; }
  loading = true; ['go', 'chain', 'rpc', 'addr', 'token'].forEach(id => $(id).disabled = true); out.textContent = 'Loading…';
  try {
    let chainId;
    try { chainId = await nativeSnapshot(url, chain.id); }
    catch (e) {
      // Only the unchanged preset can use its backup. Never replace a user's custom endpoint.
      if (url !== new URL(chain.rpc || url).href || !chain.backup) throw e;
      url = chain.backup; chainId = await nativeSnapshot(url, chain.id);
    }
    const [balance, nonce] = await Promise.all([rpcOnce(url, 'eth_getBalance', [addr, 'latest']), rpcOnce(url, 'eth_getTransactionCount', [addr, 'latest'])]);
    const rows = [['Chain ID', chainId.toString()], ['Native balance', `${formatUnits(quantity(balance), 18)} ${chain.symbol}`], ['Transactions sent', quantity(nonce).toString()]];
    // Sequential tokens bound concurrency to three RPC calls; token failures remain isolated.
    for (const token of tokens) {
      try {
        const call = data => rpcOnce(url, 'eth_call', [{ to: token, data }, 'latest']);
        const [bal, dec, sym] = await Promise.all([call('0x70a08231' + pad(addr)), call('0x313ce567'), call('0x95d89b41')]);
        const decimals = uintWord(dec); if (decimals > 255n) throw new Error('Token decimals exceed 255.');
        rows.push([`Token: ${decodeString(sym)}`, formatUnits(uintWord(bal), Number(decimals))]);
      } catch (e) { rows.push([token.slice(0, 10) + '…', 'Error: ' + e.message]); }
    }
    out.innerHTML = '<table>' + rows.map(([key, value]) => `<tr><td>${escapeHTML(key)}</td><td>${escapeHTML(value)}</td></tr>`).join('') + '</table>';
  } catch (e) { fail('Error: ' + e.message); }
  finally { loading = false; ['go', 'chain', 'rpc', 'addr', 'token'].forEach(id => $(id).disabled = false); }
};
</script>
</body>
</html>
